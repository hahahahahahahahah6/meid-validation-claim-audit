[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "meid-validation-claim-audit"
version = "0.1.0"
description = "Offline audit of documented device identifier claims"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
meid-validation-claim-audit = "meid_validation_claim_audit.__main__:main"

[tool.setuptools.packages.find]
include = ["meid_validation_claim_audit*"]
